<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --work: #059669;
    --work-2: #34d399;
    --rest: #2563eb;
    --rest-2: #60a5fa;
    --prep: #f59e0b;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    background: #111827;
    color: #fff;
    transition: background-color .4s;
  }
  body.phase-work { background: #052e23; }
  body.phase-rest { background: #0a1e3d; }
  body.phase-prep { background: #3a2a06; }

  /* --- Barra superior: estilos del light DOM para <dotrino-topbar> --- */
  .cc-install{ --cc-install-color:#e2e8f0; --cc-install-icon:16px; --cc-install-radius:10px; --cc-install-gap:6px; --cc-install-font-size:.85rem; }
  .cc-install::part(button){ height:34px; padding:0 12px; border:1px solid rgba(226,232,240,.35); }
  .tb-trailing {
    border: none;
    background: transparent;
    color: #9ca3af;
    font-size: clamp(11px, 1.9vh, 16px);
    font-weight: 700;
    padding: 8px 10px;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
    border-radius: 10px;
  }
  .tb-trailing:active { color: #fff; background: rgba(255,255,255,.08); }

  /* --- Cabecera de rondas --- */
  .round-bar {
    flex: 0 0 auto;
    text-align: center;
    padding: 1.2vh 4vw;
    font-size: clamp(15px, 2.6vh, 24px);
    font-weight: 800;
    letter-spacing: .05em;
    color: #9ca3af;
  }
  .round-bar.done { color: var(--work-2); }

  /* --- Dos timers --- */
  .timers {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 1.4vh;
    padding: 0 3vw 1.4vh;
    min-height: 0;
  }
  .card {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .6vh;
    border-radius: 16px;
    background: rgba(255,255,255,.05);
    border: 2px solid transparent;
    overflow: hidden;
    transition: background .3s, border-color .3s, filter .3s;
  }
  .card.work { background: rgba(5,150,105,.12); }
  .card.rest { background: rgba(37,99,235,.12); }
  .card:not(.active) { filter: brightness(.62) saturate(.7); }
  .card.work.active { border-color: var(--work-2); background: rgba(5,150,105,.22); }
  .card.rest.active { border-color: var(--rest-2); background: rgba(37,99,235,.22); }

  .clabel {
    font-size: clamp(13px, 2.6vh, 22px);
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #9ca3af;
  }
  .card.work .clabel { color: var(--work-2); }
  .card.rest .clabel { color: var(--rest-2); }

  .ctime {
    font-size: clamp(44px, 16vh, 150px);
    font-weight: 800;
    line-height: .95;
    font-variant-numeric: tabular-nums;
  }
  .ctime.warn { animation: heartbeat .5s ease-in-out; }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.1); }
  }

  /* Stepper de ajuste dentro de cada tarjeta */
  .cstepper {
    display: flex;
    align-items: center;
    gap: 4vw;
  }
  .cstepper button {
    width: clamp(40px, 11vw, 60px);
    height: clamp(40px, 11vw, 60px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cstepper button:active { background: rgba(255,255,255,.32); }
  .cstepper .hint {
    font-size: clamp(11px, 1.7vh, 15px);
    color: #9ca3af;
    min-width: 3.5ch;
    text-align: center;
  }

  /* --- Barra de control --- */
  .control {
    flex: 0 0 auto;
    display: flex;
    background: rgba(17,24,39,.55);
    border-top: 2px solid rgba(255,255,255,.06);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .control button {
    flex: 1;
    border: none;
    background: transparent;
    color: #d1d5db;
    font-size: clamp(12px, 2vh, 17px);
    font-weight: 700;
    padding: 1.8vh 0;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
  }
  .control button:active { background: rgba(255,255,255,.08); }
  .btn-play {
    background: var(--work) !important;
    color: #fff !important;
    font-size: clamp(15px, 2.6vh, 22px) !important;
  }
  .btn-play:active { background: #047857 !important; }
  .btn-play.paused { background: var(--prep) !important; color: #111827 !important; }

  /* --- Modal de configuración (prep + rondas) --- */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 4vh 4vw;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: #1f2937;
    color: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 460px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 22px;
    border-bottom: 1px solid #374151;
  }
  .modal-head h2 {
    font-size: clamp(16px, 2.4vh, 22px);
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    padding: 0 8px;
  }
  .modal-body { overflow-y: auto; padding: 8px 0 16px; }
  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 22px;
    border-bottom: 1px solid #374151;
  }
  .field:last-child { border-bottom: none; }
  .field-name { font-size: clamp(15px, 2.2vh, 19px); font-weight: 700; }
  .field-sub { font-size: clamp(12px, 1.5vh, 14px); color: #9ca3af; margin-top: 3px; }
  .stepper { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .stepper button {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: 24px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
  }
  .stepper button:active { background: rgba(255,255,255,.3); }
  .stepper .val {
    min-width: 4.5ch;
    text-align: center;
    font-size: clamp(18px, 2.6vh, 24px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .modal-foot { padding: 16px 22px; border-top: 1px solid #374151; }
  .total { font-size: clamp(14px, 2vh, 17px); color: #9ca3af; text-align: center; }
  .total b { color: #fff; }

  /* En horizontal, los dos timers lado a lado */
  @media (orientation: landscape) {
    .timers { flex-direction: row; }
  }
</style>

{

<body>

  <dotrino-topbar brand="GymBro" icon="./icon.svg"
    support-repo="imdotrino/dotrino-gymbro"
    support-discord="https://discord.gg/D648uq7cth"
    profile no-lang>
    <dotrino-install class="cc-install" slot="end"></dotrino-install>
    <button id="btnConfig" class="tb-trailing" slot="trailing">⚙ Prep · Rondas</button>
  </dotrino-topbar>

  <div class="round-bar" id="roundBar">Listo para entrenar</div>

  <div class="timers">
    <div class="card work" id="cardWork">
      <div class="clabel" id="labelWork">Entrenamiento</div>
      <div class="ctime" id="timeWork">00:30</div>
      <div class="cstepper" data-key="work">
        <button data-d="-1">−</button>
        <span class="hint">adjustBase</span>
        <button data-d="1">+</button>
      </div>
    </div>
    <div class="card rest" id="cardRest">
      <div class="clabel">Descanso</div>
      <div class="ctime" id="timeRest">00:15</div>
      <div class="cstepper" data-key="rest">
        <button data-d="-1">−</button>
        <span class="hint">adjustBase</span>
        <button data-d="1">+</button>
      </div>
    </div>
  </div>

  <div class="control">
    <button id="btnReset">↺ Reiniciar</button>
    <button class="btn-play" id="btnPlay">▶ Iniciar</button>
    <button id="btnSkip">⏭ Saltar</button>
  </div>

  <div class="modal" id="modalConfig">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Ajustes</h2>
        <button class="modal-close" id="btnClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <div>
            <div class="field-name">Preparación</div>
            <div class="field-sub">Cuenta atrás antes de empezar</div>
          </div>
          <div class="stepper" data-key="prep" data-step="5" data-min="0" data-max="60" data-mode="sec">
            <button data-d="-1">−</button><div class="val"></div><button data-d="1">+</button>
          </div>
        </div>
        <div class="field">
          <div>
            <div class="field-name">Rondas</div>
            <div class="field-sub">Número de series</div>
          </div>
          <div class="stepper" data-key="rounds" data-step="1" data-min="1" data-max="99" data-mode="num">
            <button data-d="-1">−</button><div class="val"></div><button data-d="1">+</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <div class="total">Total estimado: <b id="totalEst">—</b></div>
      </div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);

  const DEF = { prep: 10, work: 30, rest: 15, rounds: 8 };
  const CFG_KEY = 'gymbro_cfg';
  const LIM = {
    work:   { step: 5, min: 5, max: 900 },
    rest:   { step: 5, min: 0, max: 900 },
    prep:   { step: 5, min: 0, max: 60  },
    rounds: { step: 1, min: 1, max: 99  }
  };

  let cfg = loadConfig();

  function loadConfig() {
    try {
      const d = JSON.parse(localStorage.getItem(CFG_KEY));
      if (d && typeof d === 'object') return { ...DEF, ...d };
    } catch {}
    return { ...DEF };
  }
  function saveConfig() { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

  // Estado del timer persistido. Todo se ancla a timestamps epoch (UTC) para
  // que el refresco —o cerrar y volver— descuente el tiempo real transcurrido.
  const STATE_KEY = 'gymbro_state';
  function saveState() {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      phase: T.phase,
      round: T.round,
      running: T.running,
      finished: T.finished,
      phaseEndTs,        // epoch ms (UTC) en que acaba la fase en curso
      remaining: T.remaining  // segundos restantes si está en pausa
    }));
  }
  function clearState() { localStorage.removeItem(STATE_KEY); }

  // --- Estado del timer ---
  const T = {
    running: false,
    phase: null,      // 'prep' | 'work' | 'rest' | null
    round: 0,
    remaining: 0,
    tickId: null,
    finished: false
  };

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  }

  function render() {
    document.body.className = T.phase ? 'phase-' + T.phase : '';

    // Tarjeta de entrenamiento (también muestra la preparación, que la precede)
    const cw = $('cardWork');
    if (T.phase === 'prep') {
      $('labelWork').textContent = 'Preparación';
      $('timeWork').textContent = fmt(T.remaining);
      cw.classList.add('active');
    } else if (T.phase === 'work') {
      $('labelWork').textContent = 'Entrenamiento';
      $('timeWork').textContent = fmt(T.remaining);
      cw.classList.add('active');
    } else {
      $('labelWork').textContent = 'Entrenamiento';
      $('timeWork').textContent = fmt(cfg.work);
      cw.classList.remove('active');
    }

    // Tarjeta de descanso
    const cr = $('cardRest');
    if (T.phase === 'rest') {
      $('timeRest').textContent = fmt(T.remaining);
      cr.classList.add('active');
    } else {
      $('timeRest').textContent = fmt(cfg.rest);
      cr.classList.remove('active');
    }

    // Barra de rondas
    const rb = $('roundBar');
    rb.classList.remove('done');
    if (T.finished) {
      rb.textContent = `💪 ¡Completado! ${cfg.rounds} rondas`;
      rb.classList.add('done');
    } else if (T.phase === 'prep') {
      rb.textContent = '¡Prepárate!';
    } else if (T.phase) {
      rb.textContent = `Ronda ${T.round} / ${cfg.rounds}`;
    } else {
      rb.textContent = 'Listo para entrenar';
    }

    $('btnPlay').innerHTML = T.running ? '⏸ Pausa' : (T.phase ? '▶ Seguir' : '▶ Iniciar');
    $('btnPlay').classList.toggle('paused', T.running);
  }

  // --- Audio: beeps con WebAudio (sin archivos externos) ---
  let actx = null;
  function beep(freq = 880, dur = 0.15, vol = 0.5) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch {}
  }
  function countdownBeep() { beep(880, 0.12, 0.4); }
  function phaseChangeBeep(phase) {
    if (phase === 'work') { beep(660, 0.18); setTimeout(() => beep(990, 0.28), 180); }
    else if (phase === 'rest') { beep(520, 0.25, 0.4); }
    else { beep(440, 0.15); }
  }
  function finishBeep() {
    beep(880, 0.2); setTimeout(() => beep(1175, 0.2), 220); setTimeout(() => beep(1568, 0.4), 460);
  }
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  // --- Notificaciones cuando la app NO está en foco ---
  // Delegadas al paquete compartido del ecosistema (window.__ccNotif, cableado
  // por el <script type="module"> del final). El disparo (SW / new Notification)
  // y el permiso los maneja el controlador común.
  async function requestNotifications() {
    if (window.__ccNotif) await window.__ccNotif.requestPermission();
  }
  async function notify(title, body) {
    if (!document.hidden) return; // solo si la app no está visible
    if (!window.__ccNotif) return;
    await window.__ccNotif.notify('phase', {
      title, body, icon: 'icon-192.png', badge: 'icon-192.png',
      tag: 'gymbro', renotify: true, vibrate: [120, 60, 120]
    });
  }

  // --- Wake lock para mantener la pantalla encendida ---
  let wakeLock = null;
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); wakeLock = null; } catch {} }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && T.running) requestWakeLock();
  });

  // --- Secuencia de fases ---
  function firstPhase() {
    if (cfg.prep > 0) return { phase: 'prep', dur: cfg.prep, round: 0 };
    return { phase: 'work', dur: cfg.work, round: 1 };
  }
  function nextPhase() {
    if (T.phase === 'prep') return { phase: 'work', dur: cfg.work, round: 1 };
    if (T.phase === 'work') {
      if (T.round >= cfg.rounds) return null;
      if (cfg.rest > 0) return { phase: 'rest', dur: cfg.rest, round: T.round };
      return { phase: 'work', dur: cfg.work, round: T.round + 1 };
    }
    if (T.phase === 'rest') return { phase: 'work', dur: cfg.work, round: T.round + 1 };
    return null;
  }
  function enterPhase(f) {
    if (!f) { finish(); return; }
    T.phase = f.phase;
    T.round = f.round;
    T.remaining = f.dur;
    phaseChangeBeep(f.phase);
    vibrate(f.phase === 'work' ? [120,60,120] : 80);
    if (f.phase === 'work') notify('💪 ¡Entrenamiento!', `Ronda ${f.round} de ${cfg.rounds}`);
    else if (f.phase === 'rest') notify('😮‍💨 Descanso', `Ronda ${f.round} de ${cfg.rounds}`);
    render();
    saveState();
  }

  function finish() {
    stopTick();
    T.running = false;
    T.phase = null;
    T.round = 0;
    T.remaining = 0;
    T.finished = true;
    releaseWakeLock();
    finishBeep();
    vibrate([200,100,200,100,300]);
    notify('✅ ¡Sesión completada!', `${cfg.rounds} rondas terminadas 💪`);
    render();
    saveState();
  }

  // --- Bucle por tiempo real (robusto ante throttling) ---
  let phaseEndTs = 0;
  function stopTick() { if (T.tickId) { clearInterval(T.tickId); T.tickId = null; } }
  function startTick() {
    stopTick();
    phaseEndTs = Date.now() + T.remaining * 1000;
    T.tickId = setInterval(tick, 100);
  }
  function activeTimeEl() { return T.phase === 'rest' ? $('timeRest') : $('timeWork'); }
  function tick() {
    const prev = Math.ceil(T.remaining);
    T.remaining = (phaseEndTs - Date.now()) / 1000;
    const now = Math.ceil(T.remaining);
    const el = activeTimeEl();
    if (now !== prev && now <= 3 && now >= 1) {
      countdownBeep();
      el.classList.remove('warn'); void el.offsetWidth; el.classList.add('warn');
    }
    if (T.remaining <= 0) {
      const next = nextPhase();
      if (!next) { finish(); return; }
      enterPhase(next);
      startTick();
      return;
    }
    el.textContent = fmt(T.remaining);
  }

  function start() {
    if (T.running) return;
    T.finished = false;
    if (!T.phase) enterPhase(firstPhase());
    T.running = true;
    beep(700, 0.05, 0.2); // desbloquea audio en móviles
    requestNotifications();
    requestWakeLock();
    startTick();
    render();
    saveState();
  }
  function pause() {
    if (!T.running) return;
    stopTick();
    T.running = false;
    releaseWakeLock();
    render();
    saveState();
  }
  function togglePlay() { T.running ? pause() : start(); }

  function reset() {
    stopTick();
    T.running = false;
    T.phase = null;
    T.round = 0;
    T.remaining = 0;
    T.finished = false;
    releaseWakeLock();
    clearState();
    render();
  }
  function skip() {
    if (!T.phase) return;
    const next = nextPhase();
    if (!next) { finish(); return; }
    enterPhase(next);
    if (T.running) startTick();
  }

  // --- Ajuste de la BASE configurada (no afecta una fase en curso) ---
  function adjustBase(key, dir) {
    const l = LIM[key];
    cfg[key] = Math.max(l.min, Math.min(l.max, cfg[key] + dir * l.step));
    saveConfig();
    render();
    paintSteppers();
  }

  // ¿La tarjeta de `key` corresponde a la fase activa ahora mismo?
  // (la tarjeta de entrenamiento también aloja la preparación)
  function isActivePhase(key) {
    return (key === 'work' && (T.phase === 'work' || T.phase === 'prep'))
        || (key === 'rest' && T.phase === 'rest');
  }

  // --- Ajuste EN VIVO del tiempo restante, sin tocar la base ---
  function adjustLive(key, dir) {
    const delta = dir * LIM[key].step;
    if (T.running) {
      const now = Date.now();
      const rem = Math.max(1, (phaseEndTs - now) / 1000 + delta);
      phaseEndTs = now + rem * 1000;
      T.remaining = rem;
    } else {
      T.remaining = Math.max(1, T.remaining + delta);
    }
    activeTimeEl().textContent = fmt(T.remaining);
    saveState();
  }

  // --- Eventos: timers en pantalla ---
  $('btnPlay').addEventListener('click', togglePlay);
  $('btnReset').addEventListener('click', reset);
  $('btnSkip').addEventListener('click', skip);
  document.querySelectorAll('.cstepper button').forEach(b => {
    b.addEventListener('click', () => {
      const key = b.closest('.cstepper').dataset.key;
      const dir = Number(b.dataset.d);
      // Fase en curso (corriendo o en pausa): ajusta el tiempo restante.
      // Si no, ajusta la base configurada.
      if (T.phase && isActivePhase(key)) adjustLive(key, dir);
      else adjustBase(key, dir);
    });
  });

  // --- Modal (prep + rondas) ---
  function openConfig() { paintSteppers(); $('modalConfig').classList.add('open'); }
  function closeConfig() { $('modalConfig').classList.remove('open'); }
  function estimatedTotal() {
    return cfg.prep + cfg.rounds * cfg.work + Math.max(0, cfg.rounds - 1) * cfg.rest;
  }
  function paintSteppers() {
    document.querySelectorAll('#modalConfig .stepper').forEach(st => {
      const k = st.dataset.key;
      st.querySelector('.val').textContent = st.dataset.mode === 'sec' ? fmt(cfg[k]) : cfg[k];
    });
    $('totalEst').textContent = fmt(estimatedTotal());
  }
  document.querySelectorAll('#modalConfig .stepper button').forEach(b => {
    b.addEventListener('click', () => {
      adjustBase(b.closest('.stepper').dataset.key, Number(b.dataset.d));
    });
  });
  $('btnConfig').addEventListener('click', openConfig);
  $('btnClose').addEventListener('click', closeConfig);
  $('modalConfig').addEventListener('click', e => {
    if (e.target === $('modalConfig')) closeConfig();
  });

  // Pone al día el cronómetro tras un refresco: descuenta el tiempo real
  // (epoch/UTC) transcurrido y avanza por las fases que hayan vencido mientras
  // la página estuvo cerrada, sin emitir sonidos por las fases saltadas.
  function catchUp() {
    const now = Date.now();
    while (T.running && T.phase && now >= phaseEndTs) {
      const next = nextPhase();
      if (!next) { finish(); return; }
      T.phase = next.phase;
      T.round = next.round;
      phaseEndTs += next.dur * 1000;
    }
    if (T.running) T.remaining = (phaseEndTs - now) / 1000;
  }

  function restore() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(STATE_KEY)); } catch {}
    if (!s) { render(); return; }
    T.phase = s.phase || null;
    T.round = s.round || 0;
    T.finished = !!s.finished;
    if (s.running && s.phase) {
      phaseEndTs = s.phaseEndTs || Date.now();
      T.running = true;
      catchUp();              // puede terminar la sesión si ya venció todo
      if (T.running) { requestWakeLock(); startTick(); }
    } else if (s.phase) {
      T.remaining = s.remaining || 0;  // estaba en pausa a mitad de fase
    }
    render();
    saveState();
  }

  // Estado inicial
  restore();

  // --- PWA: service worker (el botón Instalar lo maneja <dotrino-install>) ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@dotrino/install@0.1/src/index.js"></script>
  <!-- Notificaciones compartidas del ecosistema: el controlador maneja permiso y
       disparo (SW / new Notification). GymBro solo avisa el cambio de fase. -->
  <script type="module">
    import { createNotifications } from 'https://cdn.jsdelivr.net/npm/@dotrino/notifications@0.1/src/index.js'
    window.__ccNotif = createNotifications({ storageKey: 'gymbro', categories: [], sound: false })
  </script>
  <!-- Navegación "volver" unificada del ecosistema: chevron del header + botón
       físico de Android / gesto de iOS / atrás del navegador → cierra el modal
       de config; si no hay nada → dotrino.com. -->
  <script type="module">
    import { createBackNav } from 'https://cdn.jsdelivr.net/npm/@dotrino/nav@0.2/src/index.js'
    const nav = createBackNav()
    const el = document.getElementById('modalConfig')
    if (el) {
      let handle = null
      const sync = () => {
        const open = el.classList.contains('open')
        if (open && !handle) handle = nav.open(() => el.classList.remove('open'))
        else if (!open && handle) { const h = handle; handle = null; h.close() }
      }
      new MutationObserver(sync).observe(el, { attributes: true, attributeFilter: ['class'] })
      sync()
    }
  </script>
</body>
